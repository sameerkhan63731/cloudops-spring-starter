apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudops-spring-starter
spec:
  replicas: 2
  selector:
    matchLabels: {app: cloudops-spring-starter}
  template:
    metadata:
      labels: {app: cloudops-spring-starter}
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: service
          image: ghcr.io/sameerkhan63731/cloudops-spring-starter:latest
          ports: [{containerPort: 8080}]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: 8080}
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: 8080}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
